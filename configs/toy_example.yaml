run_name: toy_example
input_path: examples/example_architecture_dataset.csv
output_dir: runs
architecture_id_column: architecture_id
architecture_column: chromosome
feature_columns: [params, flops]
target_columns: [valid_psnr]
objectives:
  - column: valid_psnr
    direction: maximize
  - column: params
    direction: minimize
  - column: flops
    direction: minimize
split:
  train: 0.6
  validation: 0.2
  test: 0.2
seed: 7
predictors: [extra_trees, svr]
zero_cost_proxies: [synflow_like]
nsga3:
  population_size: 10
  generations: 3
  archive_size: 5
plot: true
